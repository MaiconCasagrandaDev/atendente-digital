<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atendente Digital · Simulador</title>
  <style>
    :root {
      --fundo: #efeae2;
      --topo: #075e54;
      --minha: #d9fdd3;
      --bot: #ffffff;
      --texto: #111b21;
      --suave: #667781;
      --botao: #00a884;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #d1d7db;
      color: var(--texto);
      height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--fundo);
    }
    header {
      background: var(--topo);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff33;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .info { flex: 1; }
    .nome { font-weight: 600; }
    .status { font-size: 13px; opacity: 0.85; }
    header button {
      background: transparent;
      border: 1px solid #ffffff80;
      color: #fff;
      border-radius: 16px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg {
      max-width: 80%;
      padding: 7px 10px 18px;
      border-radius: 8px;
      position: relative;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-size: 15px;
      box-shadow: 0 1px 0.5px #00000022;
    }
    .minha { align-self: flex-end; background: var(--minha); border-top-right-radius: 0; }
    .bot { align-self: flex-start; background: var(--bot); border-top-left-radius: 0; }
    .hora {
      position: absolute;
      right: 8px;
      bottom: 3px;
      font-size: 11px;
      color: var(--suave);
    }
    .aviso {
      align-self: center;
      background: #fff3c4;
      font-size: 12.5px;
      color: #54656f;
      padding: 5px 10px;
      border-radius: 7px;
      text-align: center;
      max-width: 90%;
    }
    .digitando {
      align-self: flex-start;
      background: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--suave);
      font-style: italic;
      font-size: 14px;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #f0f2f5;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      border: none;
      border-radius: 20px;
      padding: 11px 14px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.35;
      outline: none;
      resize: none;
      max-height: 120px;
    }
    form button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--botao);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🍔</div>
      <div class="info">
        <div class="nome">Lanchonete do Bairro</div>
        <div class="status" id="status">online</div>
      </div>
      <button id="nova" type="button">Nova conversa</button>
    </header>

    <div id="mensagens"></div>

    <form id="form">
      <textarea id="campo" rows="1" placeholder="Mensagem"></textarea>
      <button id="enviar" type="submit" aria-label="Enviar">➤</button>
    </form>
  </div>

  <script>
    const mensagens = document.getElementById("mensagens");
    const form = document.getElementById("form");
    const campo = document.getElementById("campo");
    const enviar = document.getElementById("enviar");
    const status = document.getElementById("status");

    // Cada visitante ganha um telefone fictício, guardado no navegador
    function novoTelefone() {
      return "559900" + String(Math.floor(Math.random() * 1e7)).padStart(7, "0");
    }

    let telefone;
    try {
      telefone = localStorage.getItem("simulador-telefone") || novoTelefone();
      localStorage.setItem("simulador-telefone", telefone);
    } catch {
      telefone = novoTelefone();
    }

    let ultimoId = 0;      // id da última mensagem já mostrada
    let buscando = false;  // evita duas consultas ao mesmo tempo

    function escaparHtml(texto) {
      return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Formatação do WhatsApp: *negrito*, _itálico_, ~riscado~ e links
    function formatar(texto) {
      return escaparHtml(texto)
        .replace(/https?:\/\/[^\s<]+/g, (url) => {
          const limpo = url.replace(/[.,;:!?)]+$/, "");
          return `<a href="${limpo}">${limpo}</a>${url.slice(limpo.length)}`;
        })
        .replace(/\*(.+?)\*/g, "<strong>$1</strong>")
        .replace(/(^|\s)_(.+?)_/g, "$1<em>$2</em>")
        .replace(/~(.+?)~/g, "<s>$1</s>");
    }

    function formatarHora(data) {
      return data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function adicionarMensagem(texto, quem, data = new Date()) {
      const balao = document.createElement("div");
      balao.className = "msg " + quem;
      balao.innerHTML = formatar(texto) + '<span class="hora">' + formatarHora(data) + "</span>";
      mensagens.appendChild(balao);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function adicionarAviso(texto) {
      const aviso = document.createElement("div");
      aviso.className = "aviso";
      aviso.textContent = texto;
      mensagens.appendChild(aviso);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    let digitando = null;
    function mostrarDigitando(ligado) {
      enviar.disabled = ligado;
      status.textContent = ligado ? "digitando..." : "online";
      if (ligado) {
        digitando = document.createElement("div");
        digitando.className = "digitando";
        digitando.textContent = "digitando...";
        mensagens.appendChild(digitando);
        mensagens.scrollTop = mensagens.scrollHeight;
      } else if (digitando) {
        digitando.remove();
        digitando = null;
      }
    }

    // O campo cresce conforme o texto, até um limite
    function ajustarAltura() {
      campo.style.height = "auto";
      campo.style.height = campo.scrollHeight + "px";
    }
    campo.addEventListener("input", ajustarAltura);

    // Enter envia; Shift + Enter pula linha
    campo.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter" && !evento.shiftKey) {
        evento.preventDefault();
        form.requestSubmit();
      }
    });

    // Busca no servidor as mensagens que chegaram depois da última mostrada
    async function buscarNovas() {
      if (buscando) return;
      buscando = true;
      try {
        const resposta = await fetch(
          "/dev/history?phone=" + encodeURIComponent(telefone) + "&after=" + ultimoId,
        );
        const novas = await resposta.json();
        for (const m of novas) {
          ultimoId = Math.max(ultimoId, m.id);
          // As mensagens do cliente já aparecem na hora em que ele envia
          if (m.direction === "OUTBOUND") {
            adicionarMensagem(m.text, "bot", new Date(m.createdAt));
          }
        }
      } catch {
        // Sem conexão: tenta de novo na próxima rodada
      } finally {
        buscando = false;
      }
    }

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const texto = campo.value.trim();
      if (!texto || enviar.disabled) return;

      campo.value = "";
      ajustarAltura();
      adicionarMensagem(texto, "minha");
      mostrarDigitando(true);

      try {
        const resposta = await fetch("/dev/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: telefone, name: "Cliente da demonstração", text: texto }),
        });
        if (!resposta.ok) throw new Error("Erro ao enviar");
        mostrarDigitando(false);
        // As respostas do bot já estão salvas: busca e mostra
        await buscarNovas();
      } catch {
        mostrarDigitando(false);
        adicionarAviso("Não foi possível enviar a mensagem. Tente de novo.");
      }
      campo.focus();
    });

    document.getElementById("nova").addEventListener("click", () => {
      telefone = novoTelefone();
      try { localStorage.setItem("simulador-telefone", telefone); } catch {}
      ultimoId = 0;
      mensagens.innerHTML = "";
      adicionarAviso("Nova conversa iniciada.");
      campo.focus();
    });

    // Ao abrir: mostra o histórico e, se veio do cardápio, deixa a mensagem pronta
    async function iniciar() {
      adicionarAviso("Simulação do atendimento pelo WhatsApp. As respostas vêm do atendente com IA de verdade.");

      try {
        const resposta = await fetch("/dev/history?phone=" + encodeURIComponent(telefone));
        const historico = await resposta.json();
        for (const m of historico) {
          ultimoId = Math.max(ultimoId, m.id);
          adicionarMensagem(m.text, m.direction === "INBOUND" ? "minha" : "bot", new Date(m.createdAt));
        }
      } catch {}

      const mensagemPronta = new URLSearchParams(location.search).get("mensagem");
      if (mensagemPronta) {
        campo.value = mensagemPronta;
        ajustarAltura();
        history.replaceState(null, "", location.pathname);
      }
      campo.focus();
    }

    iniciar();

    // A cada 3 segundos, procura mensagens novas (como os avisos de status).
    // Não procura enquanto espera uma resposta, nem com a aba escondida.
    setInterval(() => {
      if (!enviar.disabled && !document.hidden) buscarNovas();
    }, 3000);
  </script>
</body>
</html>
